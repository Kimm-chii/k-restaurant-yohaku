<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        // Fixed screen height for in-app browsers (Facebook, Messenger, Instagram, TikTok):
        // measured once, updated only when the width changes, used as --sh instead of vh/dvh.
        const root = document.documentElement; let w = 0;
        const set = () => { if (innerWidth === w) return; w = innerWidth; root.style.setProperty("--sh", innerHeight / 100 + "px"); };
        set(); addEventListener("resize", set); addEventListener("orientationchange", () => { w = 0; setTimeout(set, 300); });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
